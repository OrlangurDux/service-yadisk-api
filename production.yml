services:
  service-yadisk-api:
    container_name: 'service-yadisk-api'
    build: .
    ports:
      - '9277:9277'
    environment:
      # Бинарь в scratch-образе лежит в / и ищет конфиг по CONFIG_PATH
      - CONFIG_PATH=/configs/config.yaml
      # В scratch нет $HOME — пути кэша и логов задаём явно (на volume ниже)
      - CACHE_PATH=/data/cache.json
      - LOG_DIR=/data/logs
    volumes:
      - ./src/configs/config.yaml:/configs/config.yaml:ro
      # Кэш и логи приложения — вынесены наружу, чтобы переживать пересоздание
      - yadisk-cache:/data
    restart: always

volumes:
  yadisk-cache:

networks:
  default:
    name: yadisk_api_network
    external: true
